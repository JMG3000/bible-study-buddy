name: Security Review

on:
  # Automatic runs are paused until 2026-07-01 because GitHub Actions
  # minutes are exhausted. Keep manual dispatch available for targeted checks.
  # pull_request:
  #   branches:
  #     - dev-test
  #     - main
  # schedule:
  #   - cron: "24 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  secret-pattern-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan tracked files for common secret values
        shell: bash
        run: |
          set -euo pipefail
          supabase_secret_prefix='sb_''secret_'
          supabase_public_prefix='sb_''publishable_'
          supabase_service_key='SUPABASE_''SERVICE_ROLE_KEY=.+'
          openai_key='OPENAI_''API_KEY=.+'
          meticulous_token='METICULOUS_''API_TOKEN=.+'
          secret_pattern="(${supabase_secret_prefix}|${supabase_public_prefix}|${supabase_service_key}|${openai_key}|${meticulous_token})"
          if git grep -n -E "${secret_pattern}" -- . ':!web/.env.example'; then
            echo "Potential secret value found in tracked files."
            exit 1
          fi

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
