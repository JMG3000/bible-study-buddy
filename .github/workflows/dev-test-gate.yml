name: Dev Test Gate and Production Promotion

on:
  # Automatic runs are paused until 2026-07-01 because GitHub Actions
  # minutes are exhausted. Keep manual dispatch available for targeted checks.
  # push:
  #   branches:
  #     - dev-test
  #     - main
  # pull_request:
  #   branches:
  #     - dev-test
  #     - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-test-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint, typecheck, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  promote-to-main:
    name: Promote dev-test to production main
    needs:
      - validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-test'
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward main from dev-test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev-test
          git checkout main
          git merge --ff-only origin/dev-test
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
        env:
          GITHUB_TOKEN: ${{ github.token }}
