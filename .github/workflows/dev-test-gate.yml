name: Manual Application Validation

on:
  # CircleCI is the canonical automatic application validator. This supporting
  # workflow is intentionally manual and has no branch-promotion authority.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-application-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, typecheck, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate
