name: Dev Test Gate and Production Promotion

on:
  push:
    branches:
      - dev-test
      - main
  pull_request:
    branches:
      - dev-test
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-test-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint, typecheck, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  codeql:
    name: CodeQL advanced analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  promote-to-main:
    name: Promote dev-test to production main
    needs:
      - validate
      - codeql
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-test'
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main from dev-test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev-test
          git checkout main
          git merge --ff-only origin/dev-test
          git push origin main
