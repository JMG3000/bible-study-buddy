name: Dev Test Gate and Production Promotion

on:
  # Automatic runs are paused until 2026-07-01 because GitHub Actions
  # minutes are exhausted. Keep manual dispatch available for targeted checks.
  # push:
  #   branches:
  #     - dev-test
  #     - main
  # pull_request:
  #   branches:
  #     - dev-test
  #     - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-test-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint, typecheck, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  codeql:
    name: CodeQL advanced analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  meticulous:
    name: Meticulous visual gate
    runs-on: ubuntu-latest
    needs:
      - validate
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_ENABLE_METICULOUS_RECORDER: "true"
      NEXT_PUBLIC_METICULOUS_PROJECT_ID: ${{ vars.NEXT_PUBLIC_METICULOUS_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare companion assets
        run: |
          rm -rf ../companion-assets
          mkdir -p ../companion-assets/_next
          cp -r .next/static ../companion-assets/_next/
          find ../companion-assets -name "*.map" -delete

      - name: Start app
        run: |
          npm run start -- -p 3000 > ../npm-start-meticulous.local.log 2>&1 &
          npx wait-on http://127.0.0.1:3000 --timeout 60000

      - name: Run Meticulous visual tests
        run: |
          npx @alwaysmeticulous/cli ci run-with-tunnel \
            --apiToken="$METICULOUS_API_TOKEN" \
            --appUrl="http://127.0.0.1:3000" \
            --companionAssetsFolder="../companion-assets" \
            --companionAssetsRegex="^/_next/static/"
        env:
          METICULOUS_API_TOKEN: ${{ secrets.METICULOUS_API_TOKEN }}

  promote-to-main:
    name: Promote dev-test to production main
    needs:
      - validate
      - codeql
      - meticulous
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-test'
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward main from dev-test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev-test
          git checkout main
          git merge --ff-only origin/dev-test
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
        env:
          GITHUB_TOKEN: ${{ github.token }}
